name: Build and Deploy to Nginx

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Verify Node.js Environment
        run: |
          node -v
          npm -v

      - name: Install dependencies (with lockfile)
        if: hashFiles('**/package-lock.json') != ''
        run: npm ci

      - name: Install dependencies (without lockfile)
        if: hashFiles('**/package-lock.json') == ''
        run: npm install

      - name: Build Application Production Assets
        run: npm run build

      # New deployment step leveraging local Windows pathing
      # Vite projects output to 'dist/' by default
      # This clears the Nginx directory and copies over the fresh production build
      - name: Deploy Assets to Nginx Root
        shell: powershell
        run: |
          $targetPath = "C:\www\frontend"

          # 1. Stop Nginx service to avoid file locks during copy
          & nssm stop "Nginx"
          if ($LASTEXITCODE -ne 0) { throw "NSSM failed to stop the service." }

          # 2. Clear out old files safely to prevent mixing old and new assets
          if (Test-Path $targetPath) {
              Remove-Item -Path "$targetPath\*" -Recurse -Force -ErrorAction Stop 
          } else {
              New-Item -ItemType Directory -Force -Path $targetPath
          }
          # 3. Copy the fresh build items from the pipeline workspace into Nginx
          Copy-Item -Path "dist\*" -Destination $targetPath -Recurse -Force

          # 4. Start Nginx service to serve the updated assets
          & nssm start "Nginx"
          if ($LASTEXITCODE -ne 0) { throw "NSSM failed to start the service." }
